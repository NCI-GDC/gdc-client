name: ci
on:
  push:
    branches:
      - develop
      - release/**
      - hotfix/**
      - test-ci-matrix-upgrade
    tags:
      - '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      GDC_CLIENT_ZIP: 'gdc-client.zip'
    steps:
      - uses: actions/checkout@v2
        with:
          # required for setuptools_scm to correctly version: https://github.com/pypa/setuptools_scm/issues/480
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install dependencies
        run: uv sync --extra dev
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
      - name: Run Tests
#        env:
#          NO_PROXY: "127.0.0.1,localhost"
#          no proxy: "127.0.0.1,localhost"
        run: uv run pytest tests/
      - name: Package
        run: |
          cd bin
          uv run bash ./package
          echo "GDC_CLIENT_ZIP=$GDC_CLIENT_ZIP" >> $GITHUB_ENV
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GDC_CLIENT_ZIP }}-py${{ matrix.python }}-${{ matrix.os }}
          path: bin/gdc-client_*.zip
