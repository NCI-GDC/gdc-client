name: ci
on:
  push:
    branches:
      - develop
      - release/**
      - hotfix/**
      - feat/DEV-3737_Matrix_update
    tags:
      - '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-2025
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      GDC_CLIENT_ZIP: 'gdc-client.zip'
    steps:
      - uses: actions/checkout@v2
        with:
          # required for setuptools_scm to correctly version: https://github.com/pypa/setuptools_scm/issues/480
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Run Tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
          UV_INDEX_URL: "https://pypi.org/simple"
        run: uv run tox
      - name: Package
        run: |
          cd bin
          uv run bash ./package
          echo "GDC_CLIENT_ZIP=$GDC_CLIENT_ZIP" >> $GITHUB_ENV
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GDC_CLIENT_ZIP }}-py${{ matrix.python }}-${{ matrix.os }}
          path: bin/gdc-client_*.zip
